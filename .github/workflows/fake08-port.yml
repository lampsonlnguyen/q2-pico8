name: Q2 PICO-8 bridge
on:
  push:
    branches: [main, q2-playable-controls]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: q2-pico8-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install native and MIPS tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld gcc g++ make unzip zip file libpng-dev python3-numpy python3-pil
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Vet and test the itch.io helper
        working-directory: src/itch-helper
        run: |
          test -z "$(gofmt -l $(ls *.go))"
          go vet -mod=vendor .
          go test -mod=vendor .
      - name: Verify existing freestanding Q2 browser
        run: |
          bash -n tools/build-fake08.sh
          bash -n tools/test-fake08-link.sh
          make check
          clang --target=mipsel-linux-gnu -march=mips32r2 -mabi=32 \
            -mfp64 -mnan=2008 -ffreestanding -std=c11 -Wall -Wextra -Werror \
            -DQ2_GLIBC -Isrc -fsyntax-only src/q2_platform.c src/q2_input.c
      - name: Verify installable browser-preview archive
        run: |
          unzip -t dist/q2-femto8-browser-preview.zip
          unzip -Z1 dist/q2-femto8-browser-preview.zip | grep -Fx '.pico8/q2app'
          unzip -Z1 dist/q2-femto8-browser-preview.zip | grep -Fx '.pico8/q2-pico8'
          unzip -p dist/q2-femto8-browser-preview.zip .pico8/q2app | grep -Fx 'game=1'
          file dist/.pico8/q2-pico8 | grep -E 'ELF 32-bit LSB.*MIPS'
      - uses: actions/upload-artifact@v6
        with:
          name: q2-pico8-browser-preview
          path: dist/q2-femto8-browser-preview.zip
          if-no-files-found: error
      - name: Get pinned FAKE-08 upstream sources
        run: |
          git init -q /tmp/fake-08
          git -C /tmp/fake-08 remote add origin https://github.com/jtothebell/fake-08.git
          git -C /tmp/fake-08 fetch --depth 1 origin 814991a2571ad3970e386cef48f3b148aa1c27b9
          git -C /tmp/fake-08 checkout -q --detach FETCH_HEAD
          git -C /tmp/fake-08 submodule update --init --depth 1
      - name: Compile native FAKE-08 adapter against real upstream headers
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsyntax-only \
            -Isrc -I/tmp/fake-08/source -I/tmp/fake-08/libs/z8lua \
            -I/tmp/fake-08/libs/miniz -I/tmp/fake-08/libs/lodepng \
            -I/tmp/fake-08/libs/simpleini src/fake08_host.cpp
          g++ -std=c++17 -Wall -Wextra -Werror -fsyntax-only \
            -Isrc -I/tmp/fake-08/source -I/tmp/fake-08/libs/z8lua \
            -I/tmp/fake-08/libs/miniz -I/tmp/fake-08/libs/lodepng \
            -I/tmp/fake-08/libs/simpleini src/fake08_main.cpp
          g++ -std=c++17 -DQ2_GLIBC -fsyntax-only \
            -Isrc -I/tmp/fake-08/source -I/tmp/fake-08/libs/z8lua \
            -I/tmp/fake-08/libs/miniz -I/tmp/fake-08/libs/lodepng \
            -I/tmp/fake-08/libs/simpleini src/fake08_main.cpp
          for file in src/app.cpp src/ui.cpp src/covers.cpp src/coverflow.cpp \
                      src/library.cpp src/getgames.cpp; do
            g++ -std=c++17 -Wall -Wextra -Werror -DQ2_GLIBC -fsyntax-only \
              -Isrc -I/tmp/fake-08/source -I/tmp/fake-08/libs/z8lua \
              -I/tmp/fake-08/libs/lodepng "$file"
          done
          gcc -std=gnu11 -Wall -Wextra -Werror -fsyntax-only src/itch.c
      - name: Link the full FAKE-08 game engine against Q2 host ABI
        run: FAKE08_SRC=/tmp/fake-08 bash tools/test-fake08-link.sh
      - name: Run host Q2 gameplay, input, rendering and audio regression tests
        run: FAKE08_SRC=/tmp/fake-08 bash tests/host_q2_sim/run.sh "$RUNNER_TEMP/q2-pico8-host-sim"
      - name: Upload gameplay simulation summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q2-pico8-host-simulation-report
          path: |
            ${{ runner.temp }}/q2-pico8-host-sim/report.md
            ${{ runner.temp }}/q2-pico8-host-sim/summary.json
          if-no-files-found: ignore
          retention-days: 14

  device:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install MIPS C++ cross toolchain and firmware extraction tools
        run: |
          sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=20
          DEBIAN_FRONTEND=noninteractive sudo -E apt-get install -y --no-install-recommends \
            -o Acquire::Retries=1 -o Acquire::http::Timeout=20 \
            g++-11-mipsel-linux-gnu gcc-11-mipsel-linux-gnu file curl unzip zip \
            binutils xz-utils squashfs-tools python3 qemu-user patchelf
      - name: Fetch original Q2 V1.36 firmware and build hardware sysroot
        run: |
          set -euo pipefail
          mkdir -p fw
          curl --fail --location --retry 3 --silent --show-error \
            'https://raw.githubusercontent.com/lampsonlnguyen/q2-diamond-crush/main/fw/Q2%20Firmware%20V1.36.zip' \
            -o 'fw/Q2 Firmware V1.36.zip'
          git clone --depth 1 https://github.com/DiamondBond/q2-rockbox.git /tmp/q2-rockbox
          cp /tmp/q2-rockbox/tools/shanlingq2/mksysroot.sh /tmp/mksysroot-v136.sh
          sed -i 's/Q2 Firmware V1.32/Q2 Firmware V1.36/g' /tmp/mksysroot-v136.sh
          sha=$(sha256sum 'fw/Q2 Firmware V1.36.zip' | cut -d' ' -f1)
          sed -i "s/154c17822d09be001be35c03d2d3488424dee195221790bd70864480d55b0f00/$sha/g" /tmp/mksysroot-v136.sh
          sh /tmp/mksysroot-v136.sh 'fw/Q2 Firmware V1.36.zip' "$HOME/.cache/q2/sysroot"
      - name: Fetch pinned FAKE-08 and dependencies
        run: |
          git init -q /tmp/fake-08
          git -C /tmp/fake-08 remote add origin https://github.com/jtothebell/fake-08.git
          git -C /tmp/fake-08 fetch --depth 1 origin 814991a2571ad3970e386cef48f3b148aa1c27b9
          git -C /tmp/fake-08 checkout -q --detach FETCH_HEAD
          git -C /tmp/fake-08 submodule update --init --depth 1
      - name: Install Debian Buster glibc-2.28-compatible C++ runtime
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            'https://archive.debian.org/debian/pool/main/g/gcc-8/libstdc++-8-dev_8.3.0-6_mipsel.deb' \
            -o /tmp/libstdcpp8.deb
          mkdir -p /tmp/gcc8
          dpkg-deb -x /tmp/libstdcpp8.deb /tmp/gcc8
          find /tmp/gcc8 -name libstdc++.a -print
          test -f /tmp/gcc8/usr/lib/gcc/mipsel-linux-gnu/8/libstdc++.a
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Cross-compile real FAKE-08 engine and the itch.io helper for Q2
        env:
          FAKE08_SRC: /tmp/fake-08
          Q2_CXX: mipsel-linux-gnu-g++-11
          Q2_CC: mipsel-linux-gnu-gcc-11
          Q2_GCC8_ROOT: /tmp/gcc8
          Q2_REQUIRE_ITCH: '1'
        run: bash tools/build-fake08.sh
      - name: Check MIPS architecture and runtime dependencies
        run: |
          file dist/player/.pico8/q2-pico8
          readelf -h dist/player/.pico8/q2-pico8
          readelf -h dist/player/.pico8/q2-pico8 | grep -i nan2008
          readelf -l dist/player/.pico8/q2-pico8 | grep -F '/lib/ld-linux-mipsn8.so.1'
          readelf -A dist/player/.pico8/q2-pico8
          readelf -d dist/player/.pico8/q2-pico8 | grep NEEDED || true
          # ld.so as DT_NEEDED lets its dl-minimal malloc/realloc win over
          # libc's and aborts in the FAKE-08 Vm constructor (exit 127).
          if readelf -d dist/player/.pico8/q2-pico8 | grep -F 'ld-linux-mipsn8.so.1'; then
            echo 'ld-linux-mipsn8.so.1 must not be DT_NEEDED' >&2
            exit 1
          fi
      - name: Smoke-test MIPS executable startup with firmware loader
        run: |
          set -euxo pipefail
          # No Q2 framebuffer in the runner; the app should return cleanly
          # from q2_open(). This verifies loader, libc and static C++ startup.
          timeout 15s qemu-mipsel -L "$HOME/.cache/q2/sysroot" dist/player/.pico8/q2-pico8
          # The Go helper is static soft-float MIPS; "qr" needs no network.
          readelf -h dist/player/.pico8/q2-pico8-itch | grep -i nan2008
          timeout 30s qemu-mipsel dist/player/.pico8/q2-pico8-itch qr https://example.itch.io/game > /tmp/qr.txt
          test "$(head -c 21 /tmp/qr.txt | tr -d 01)" = ""
          test "$(wc -l < /tmp/qr.txt)" -ge 21
      - name: Verify playable install ZIP
        run: |
          unzip -t dist/q2-pico8-playable-experimental.zip
          unzip -p dist/q2-pico8-playable-experimental.zip .pico8/q2app | grep -Fx 'name=PICO-8'
          unzip -p dist/q2-pico8-playable-experimental.zip .pico8/q2-pico8 | cmp - dist/player/.pico8/q2-pico8
          for member in .pico8/q2-pico8-itch .pico8/itch-ca.pem .pico8/licenses/NOTICE.md \
                        .pico8/licenses/Liberation-Sans-OFL.txt .pico8/licenses/Go.txt; do
            unzip -Z1 dist/q2-pico8-playable-experimental.zip | grep -Fx "$member"
          done
      - uses: actions/upload-artifact@v6
        with:
          name: q2-pico8-playable-experimental
          path: dist/q2-pico8-playable-experimental.zip
          if-no-files-found: error
  release:
    name: Publish tagged build
    needs: [bridge, device]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download tested playable build
        uses: actions/download-artifact@v6
        with:
          name: q2-pico8-playable-experimental
          path: dist
      - name: Download tested browser preview
        uses: actions/download-artifact@v6
        with:
          name: q2-pico8-browser-preview
          path: dist
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          assets=(dist/q2-pico8-playable-experimental.zip dist/q2-femto8-browser-preview.zip)
          for asset in "${assets[@]}"; do test -s "$asset"; done
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            flags=()
            case "$TAG" in
              *-alpha*|*-beta*|*-rc*) flags=(--prerelease) ;;
            esac
            gh release create "$TAG" "${assets[@]}" --verify-tag --title "$TAG" --generate-notes "${flags[@]}" --repo "$GITHUB_REPOSITORY"
          fi
